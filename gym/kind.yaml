# One node, with room for many shops. A shop is nine pods, and kind's
# default limit of 110 pods per node fills up at about ten shops.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        maxPods: 250
